services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - koha
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["memcached", "-m", "256"]
    networks:
      - koha
    healthcheck:
      test: ["CMD-SHELL", "pidof memcached >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      TZ: ${TZ}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - koha
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: ${TZ}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - koha
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  koha:
    image: teogramm/koha:24.05
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      memcached:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      KOHA_INSTANCE: ${KOHA_INSTANCE}
      KOHA_LANGS: ${KOHA_LANGS}
      MYSQL_SERVER: mariadb
      DB_NAME: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MEMCACHED_SERVERS: ${MEMCACHED_SERVERS}
      MB_HOST: rabbitmq
      MB_PORT: ${RABBITMQ_STOMP_PORT}
      MB_USER: ${RABBITMQ_USER}
      MB_PASS: ${RABBITMQ_PASSWORD}
      USE_ELASTICSEARCH: "true"
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
      OVERRIDE_SYSPREF_SearchEngine: Elasticsearch
      KOHA_INTRANET_PORT: 8081
      KOHA_OPAC_PORT: 8080
    volumes:
      - koha_etc:/etc/koha
      - koha_lib:/var/lib/koha
      - koha_logs:/var/log/koha
    networks:
      - koha
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      koha:
        condition: service_healthy
    ports:
      - "${UI_PORT}:8443"
      - "${STAFF_PORT}:9443"
    volumes:
      - ./config/nginx/koha.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/certs:/etc/nginx/certs:ro
    networks:
      - koha
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1:8443/healthz >/dev/null 2>&1 || { echo opac endpoint failed; exit 1; }; wget --no-check-certificate -q --spider https://127.0.0.1:9443/healthz >/dev/null 2>&1 || { echo staff endpoint failed; exit 1; }"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  mariadb_data:
  opensearch_data:
  rabbitmq_data:
  koha_etc:
  koha_lib:
  koha_logs:

networks:
  koha:
    driver: bridge
